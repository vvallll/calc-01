<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tab icon: the blue acrylic "=" key; bars sit on a 4-unit grid so they stay sharp at 16 and 32 px -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86a0ff"/>
      <stop offset="1" stop-color="#4e6cee"/>
    </linearGradient>
    <radialGradient id="sheen" cx="32" cy="0" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#body)"/>
  <rect width="64" height="64" rx="14" fill="url(#sheen)"/>
  <rect x="16" y="20" width="32" height="8" rx="4" fill="#fff"/>
  <rect x="16" y="36" width="32" height="8" rx="4" fill="#fff"/>
</svg>
